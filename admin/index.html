<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YoSinTV Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:#fff;
}

.wrap{max-width:1250px;margin:auto;padding:20px}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

h1{margin:0;font-size:30px}

.badge{
  background:#22c55e;
  color:#052e16;
  padding:8px 14px;
  border-radius:999px;
  font-weight:800;
}

.card{
  background:#1e293b;
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 12px 35px rgba(0,0,0,.28);
}

.row{display:flex;gap:10px;flex-wrap:wrap}

button,select,input{
  border:0;
  border-radius:12px;
  padding:13px 15px;
  font-size:15px;
}

select,input{background:#334155;color:white}
input{min-width:260px;flex:1}

button{
  background:#22c55e;
  color:#04130a;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

button:hover{opacity:.9;transform:translateY(-1px)}
.blue{background:#38bdf8;color:#082f49}
.danger{background:#ef4444;color:#fff}
.dark{background:#475569;color:white}

.editor-card{padding:0;overflow:hidden}

.editor-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:#020617;
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:12px 16px;
}

.editor-title{font-weight:800;color:#93c5fd}
.editor-actions{font-size:13px;color:#94a3b8}

.code-editor-wrap{
  display:flex;
  width:100%;
  height:72vh;
  background:#020617;
  overflow:hidden;
}

#lineNumbers{
  margin:0;
  padding:20px 10px;
  min-width:52px;
  text-align:right;
  background:#020617;
  color:#64748b;
  font-family:"SFMono-Regular","Consolas","Liberation Mono",monospace;
  font-size:12.5px;
  line-height:1.5;
  user-select:none;
  overflow:hidden;
  border-right:1px solid rgba(255,255,255,.08);
}

textarea{
  flex:1;
  width:100%;
  height:100%;
  display:block;
  background:#020617;
  color:#d1fae5;
  font-family:"SFMono-Regular","Consolas","Liberation Mono",monospace;
  font-size:12.5px;
  line-height:1.5;
  border:0;
  outline:0;
  padding:20px;
  resize:none;

  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:normal;

  overflow-x:auto;
  overflow-y:auto;

  tab-size:2;
  caret-color:#22c55e;
}

textarea:focus{box-shadow:inset 0 0 0 2px #22c55e}

#status{margin:0;font-weight:700}
#statusBox{display:none}

.small-note{font-size:13px;color:#94a3b8;margin-top:10px}
.footer{text-align:center;opacity:.6;font-size:13px;padding-bottom:20px}

textarea::-webkit-scrollbar{
  width:10px;
  height:10px;
}

textarea::-webkit-scrollbar-track{background:#020617}
textarea::-webkit-scrollbar-thumb{background:#334155;border-radius:999px}
textarea::-webkit-scrollbar-thumb:hover{background:#475569}

@media(max-width:768px){
  .row{flex-direction:column}
  button,select,input{width:100%}
  h1{font-size:24px}
  .code-editor-wrap{height:66vh}
  textarea{font-size:12px;line-height:1.45}
  #lineNumbers{font-size:12px;line-height:1.45}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <h1>YoSinTV Admin</h1>
    <div class="badge">yosintv2/blog</div>
  </div>

  <div class="card">
    <div class="row">

      <select id="file">
        <option>Loading active JSON files...</option>
      </select>

      <input
        type="text"
        id="searchFile"
        placeholder="Search active JSON file e.g. ipl, nepal, alnassr"
        oninput="filterFiles()"
      />

      <input
        type="text"
        id="commitMessage"
        placeholder="Auto commit note..."
      />

      <button onclick="loadFile()">Load</button>
      <button onclick="saveFile()">Save</button>
      <button class="blue" onclick="formatJson()">Format</button>
      <button class="danger" onclick="clearEditor()">Clear</button>
      <button class="dark" onclick="logout()">Logout</button>

    </div>

    <div class="small-note">
      Dropdown shows only JSON files found from cricket/football API details_url. ✅ means saved from this browser.
    </div>
  </div>

  <div id="statusBox" class="card">
    <p id="status">Ready</p>
  </div>

  <div class="card editor-card">
    <div class="editor-top">
      <div class="editor-title" id="editorTitle">Select JSON file</div>
      <div class="editor-actions">Line Numbers · JSON Validator · GitHub Save</div>
    </div>

    <div class="code-editor-wrap">
      <pre id="lineNumbers">1</pre>

      <textarea
        id="editor"
        spellcheck="false"
        placeholder="Select and load JSON file..."
        oninput="updateLineNumbers(); validateJsonLive();"
        onscroll="syncScroll()"
      ></textarea>
    </div>
  </div>

  <div class="footer">
    YoSinTV Blog Admin · Vercel + GitHub API
  </div>

</div>

<script>
const API_URL = "/api/github";

const SOURCE_APIS = [
  "https://yosintv-api.pages.dev/api/cricket.json",
  "https://yosintv-api.pages.dev/api/footballl.json"
];

let allFiles = [];

const password = localStorage.getItem("blog_admin_password");

if(!password){
  window.location.href = "/admin/login.html";
}

function getSavedFiles(){
  return JSON.parse(localStorage.getItem("blog_saved_files") || "{}");
}

function markFileSaved(file){
  const saved = getSavedFiles();
  saved[file] = Date.now();
  localStorage.setItem("blog_saved_files", JSON.stringify(saved));
}

function timeAgo(timestamp){
  if(!timestamp) return "";

  const seconds = Math.floor((Date.now() - timestamp) / 1000);

  if(seconds < 10) return "just now";
  if(seconds < 60) return `${seconds} seconds ago`;

  const minutes = Math.floor(seconds / 60);
  if(minutes < 60) return `${minutes} minute${minutes > 1 ? "s" : ""} ago`;

  const hours = Math.floor(minutes / 60);
  if(hours < 24) return `${hours} hour${hours > 1 ? "s" : ""} ago`;

  const days = Math.floor(hours / 24);
  return `${days} day${days > 1 ? "s" : ""} ago`;
}

function getCurrentTimeText(){
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0");
  const min = String(d.getMinutes()).padStart(2,"0");

  return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
}

function makeAutoCommitMessage(file){
  return `${getCurrentTimeText()} - ${file}`;
}

function setAutoCommit(){
  const file = document.getElementById("file").value;
  if(!file || file.includes("Loading")) return;

  document.getElementById("commitMessage").value =
    makeAutoCommitMessage(file);
}

function setStatus(msg,type="info"){
  const status = document.getElementById("status");
  const box = document.getElementById("statusBox");

  box.style.display = "block";
  status.innerText = msg;

  if(type === "success"){
    box.style.background = "#052e16";
    box.style.borderColor = "#16a34a";
    status.style.color = "#86efac";
  }else if(type === "error"){
    box.style.background = "#450a0a";
    box.style.borderColor = "#dc2626";
    status.style.color = "#fca5a5";
  }else{
    box.style.background = "#1e293b";
    box.style.borderColor = "rgba(255,255,255,.08)";
    status.style.color = "#e2e8f0";
  }
}

function updateEditorTitle(){
  const file = document.getElementById("file").value;
  const saved = getSavedFiles();

  if(saved[file]){
    document.getElementById("editorTitle").innerText =
      `Editing: ${file} ✅ - link updated ${timeAgo(saved[file])}`;
  }else{
    document.getElementById("editorTitle").innerText =
      "Editing: " + file;
  }
}

function updateLineNumbers(){
  const editor = document.getElementById("editor");
  const lineNumbers = document.getElementById("lineNumbers");

  const lines = editor.value.split("\n").length;

  lineNumbers.textContent = Array.from(
    {length: lines},
    (_, i) => i + 1
  ).join("\n");
}

function syncScroll(){
  const editor = document.getElementById("editor");
  const lineNumbers = document.getElementById("lineNumbers");

  lineNumbers.scrollTop = editor.scrollTop;
}

function getJsonErrorLine(error,text){
  const msg = error.message;
  const posMatch = msg.match(/position (\d+)/i);

  if(posMatch){
    const pos = Number(posMatch[1]);
    const before = text.slice(0,pos);
    const lines = before.split("\n");
    const line = lines.length;
    const column = lines[lines.length - 1].length + 1;

    return {line,column,message:msg};
  }

  return {line:null,column:null,message:msg};
}

function validateJsonLive(){
  const editor = document.getElementById("editor");
  const text = editor.value.trim();

  if(!text){
    setStatus("Editor is empty","info");
    return false;
  }

  try{
    JSON.parse(text);
    setStatus("✅ Valid JSON","success");
    return true;
  }catch(e){
    const err = getJsonErrorLine(e,text);

    if(err.line){
      setStatus(
        `❌ JSON Error on line ${err.line}, column ${err.column}: ${err.message}`,
        "error"
      );
    }else{
      setStatus(
        `❌ JSON Error: ${err.message}`,
        "error"
      );
    }

    return false;
  }
}

function populateFiles(files){
  const select = document.getElementById("file");
  const currentValue = select.value;
  const saved = getSavedFiles();

  select.innerHTML = "";

  if(!files.length){
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "No active JSON files found";
    select.appendChild(opt);
    updateEditorTitle();
    return;
  }

  files.forEach(file => {
    const opt = document.createElement("option");
    opt.value = file;
    opt.textContent = saved[file] ? `${file} ✅` : file;
    select.appendChild(opt);
  });

  if(files.includes(currentValue)){
    select.value = currentValue;
  }

  updateEditorTitle();
  setAutoCommit();
}

function filterFiles(){
  const q = document.getElementById("searchFile").value.toLowerCase();
  const filtered = allFiles.filter(file => file.toLowerCase().includes(q));
  populateFiles(filtered);
}

function extractMatches(data){
  if(Array.isArray(data)) return data;
  if(Array.isArray(data.matches)) return data.matches;
  if(Array.isArray(data.data)) return data.data;
  if(Array.isArray(data.events)) return data.events;
  return [];
}

function extractJsonFileFromDetailsUrl(detailsUrl){
  if(!detailsUrl) return null;

  try{
    const u = new URL(detailsUrl);
    const slug = u.searchParams.get("yosintv");

    if(!slug) return null;

    return slug.trim().replace(/\.json$/i,"") + ".json";
  }catch(e){
    return null;
  }
}

async function loadFileList(){
  setStatus("Loading active JSON files from cricket/football API...","info");

  try{
    const found = new Set();

    for(const api of SOURCE_APIS){
      const res = await fetch(api);

      if(!res.ok){
        throw new Error("Could not load source API: " + api);
      }

      const data = await res.json();
      const matches = extractMatches(data);

      matches.forEach(item => {
        const file = extractJsonFileFromDetailsUrl(item.details_url);
        if(file){
          found.add(file);
        }
      });
    }

    allFiles = Array.from(found).sort();

    populateFiles(allFiles);

    setStatus("✅ Loaded " + allFiles.length + " active JSON files","success");

    if(allFiles.length){
      loadFile();
    }

  }catch(e){
    setStatus("❌ " + e.message,"error");
  }
}

document.getElementById("file").addEventListener("change",function(){
  updateEditorTitle();
  setAutoCommit();
  loadFile();
});

async function loadFile(){
  const file = document.getElementById("file").value;

  if(!file || file.includes("Loading") || file.includes("No active")) return;

  updateEditorTitle();
  setAutoCommit();

  setStatus("Loading " + file + "...","info");

  try{
    const res = await fetch(
      `${API_URL}?path=${encodeURIComponent(file)}&password=${encodeURIComponent(password)}`
    );

    const data = await res.json();

    if(!res.ok){
      throw new Error(data.message || data.error || "Load failed");
    }

    const editor = document.getElementById("editor");
    editor.value = JSON.stringify(data.content,null,2);

    updateLineNumbers();
    validateJsonLive();

    setStatus("✅ Loaded successfully: " + file,"success");

  }catch(e){
    setStatus("❌ " + e.message,"error");
  }
}

async function saveFile(){
  const file = document.getElementById("file").value;
  const editor = document.getElementById("editor");

  if(!file || file.includes("Loading") || file.includes("No active")){
    setStatus("❌ Please select a valid JSON file.","error");
    return;
  }

  const commitMessage =
    document.getElementById("commitMessage").value.trim()
    || makeAutoCommitMessage(file);

  let content;

  try{
    content = JSON.parse(editor.value);
  }catch(e){
    const err = getJsonErrorLine(e,editor.value);

    if(err.line){
      setStatus(
        `❌ Cannot save. JSON error on line ${err.line}, column ${err.column}: ${err.message}`,
        "error"
      );
    }else{
      setStatus(
        `❌ Cannot save. JSON error: ${err.message}`,
        "error"
      );
    }

    return;
  }

  setStatus("Saving to GitHub...","info");

  try{
    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        password,
        path:file,
        content,
        message:commitMessage
      })
    });

    const data = await res.json();

    if(!res.ok){
      throw new Error(data.message || data.error || "Save failed");
    }

    markFileSaved(file);

    const q = document.getElementById("searchFile").value.toLowerCase();
    populateFiles(q ? allFiles.filter(f => f.toLowerCase().includes(q)) : allFiles);

    updateEditorTitle();
    setAutoCommit();
    updateLineNumbers();
    validateJsonLive();

    setStatus("✅ Saved successfully: " + file,"success");

  }catch(e){
    setStatus("❌ " + e.message,"error");
  }
}

function formatJson(){
  try{
    const editor = document.getElementById("editor");
    const json = JSON.parse(editor.value);

    editor.value = JSON.stringify(json,null,2);

    updateLineNumbers();
    validateJsonLive();

    setStatus("✅ JSON formatted successfully","success");
  }catch(e){
    const err = getJsonErrorLine(e,document.getElementById("editor").value);

    if(err.line){
      setStatus(
        `❌ JSON Error on line ${err.line}, column ${err.column}: ${err.message}`,
        "error"
      );
    }else{
      setStatus("❌ Invalid JSON","error");
    }
  }
}

function clearEditor(){
  document.getElementById("editor").value = "";
  updateLineNumbers();
  setStatus("Editor cleared","info");
}

function logout(){
  localStorage.removeItem("blog_admin_password");
  window.location.href = "/admin/login.html";
}

setInterval(updateEditorTitle,30000);

updateLineNumbers();
loadFileList();
</script>

</body>
</html>
