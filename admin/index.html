<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YoSinTV Link Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;500&family=DM+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d0d;
  --surface: #141414;
  --surface2: #191919;
  --surface3: #202020;
  --border: rgba(255,255,255,.08);
  --border2: rgba(255,255,255,.14);
  --text: #e6e6e6;
  --text2: #9a9a9a;
  --text3: #636363;
  --green: #4ade80;
  --red: #f87171;
  --amber: #c9a227;
  --mono: "DM Mono", "SFMono-Regular", "Consolas", monospace;
}

body {
  font-family: "DM Sans", system-ui, sans-serif;
  font-weight: 300;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 72px;
}

.wrap { max-width: 680px; margin: 0 auto; padding: 26px 14px; }

.topbar {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.brand-name {
  font-size: 12px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .16em;
}

.brand-sub {
  font-size: 11px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .16em;
  margin-left: 8px;
}

.topbar-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.sep { display: none; }

.pill, .btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .1em;
  cursor: pointer;
  text-decoration: none;
  transition: .15s ease;
}

.pill {
  padding: 7px 9px;
  border-radius: 4px;
}

.pill:hover, .btn:hover {
  border-color: var(--border2);
  color: var(--text);
  background: var(--surface2);
}

.pill.danger:hover {
  color: var(--red);
  border-color: rgba(248,113,113,.35);
}

.pill svg, .btn svg {
  width: 13px;
  height: 13px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.panel {
  border: 1px solid var(--border);
  background: var(--surface);
}

.toolbar {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  padding: 10px;
  border-bottom: 1px solid var(--border);
}

select, input[type="text"] {
  width: 100%;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 8px 9px;
  font-size: 12px;
  font-family: inherit;
  font-weight: 300;
  outline: none;
}

select:focus, input[type="text"]:focus {
  border-color: var(--border2);
}

.editor-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  background: #101010;
}

.editor-filename {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.match-badge {
  font-size: 10px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: .1em;
}

.badge-live {
  color: var(--green);
  border: 1px solid rgba(74,222,128,.3);
}

.badge-soon {
  color: var(--amber);
  border: 1px solid rgba(201,162,39,.3);
}

.badge-over {
  color: var(--text3);
  border: 1px solid var(--border);
}

.editor-wrap {
  display: flex;
  height: 64vh;
  background: #0b0b0b;
}

#lineNumbers {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.65;
  padding: 14px 9px;
  min-width: 42px;
  text-align: right;
  color: var(--text3);
  background: #101010;
  border-right: 1px solid var(--border);
  user-select: none;
  overflow: hidden;
  white-space: pre;
  flex-shrink: 0;
}

#editor {
  flex: 1;
  background: #0b0b0b;
  color: #d6d6d6;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.65;
  border: none;
  outline: none;
  padding: 14px;
  resize: none;
  tab-size: 2;
  white-space: pre;
  overflow-x: auto;
  overflow-y: auto;
  caret-color: var(--green);
}

#editor::placeholder { color: var(--text3); }

.statusbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-top: 1px solid var(--border);
  background: #101010;
  font-size: 11px;
  color: var(--text3);
}

.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--text3);
  flex-shrink: 0;
}

.status-dot.ok { background: var(--green); }
.status-dot.err { background: var(--red); }

.action-bar {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 6px;
  border: 1px solid var(--border);
  background: rgba(13,13,13,.92);
  backdrop-filter: blur(12px);
}

.hint { display: none; }

.action-btns {
  display: flex;
  gap: 6px;
}

.btn {
  padding: 8px 11px;
  border-radius: 3px;
}

.btn.primary {
  color: var(--green);
  border-color: rgba(74,222,128,.35);
}

.btn.primary:hover {
  background: rgba(74,222,128,.08);
}

@media (max-width: 600px) {
  .wrap { padding: 14px 10px 86px; }
  .topbar-actions { width: 100%; }
  .pill { flex: 1; justify-content: center; }
  .editor-wrap { height: 58vh; }

  .action-bar {
    left: 10px;
    right: 10px;
    bottom: 10px;
  }

  .action-btns {
    width: 100%;
  }

  .btn {
    flex: 1;
    justify-content: center;
  }
}
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <span class="brand-name">YoSinTV</span>
      <span class="brand-sub">Link Manager</span>
    </div>

    <div class="topbar-actions">
      <a class="pill" href="https://sofax3.vercel.app/" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Match admin
      </a>

      <div class="sep"></div>

      <button class="pill" onclick="formatJson()">
        <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        Format
      </button>

      <button class="pill" onclick="clearEditor()">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Clear
      </button>

      <button class="pill danger" onclick="logout()">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </div>

  <div class="panel">

    <div class="toolbar">
      <select id="file" onchange="onFileChange()">
        <option>Loading files...</option>
      </select>
      <input type="text" id="searchFile" placeholder="Filter..." oninput="filterFiles()" />
      <input type="text" id="commitMessage" placeholder="Commit message..." />
    </div>

    <div class="editor-meta">
      <span class="editor-filename" id="editorTitle">—</span>
      <span id="matchBadge"></span>
    </div>

    <div class="editor-wrap">
      <pre id="lineNumbers">1</pre>
      <textarea
        id="editor"
        spellcheck="false"
        placeholder="Select a file to begin..."
        oninput="updateLineNumbers(); validateJsonLive();"
        onscroll="syncScroll()"
      ></textarea>
    </div>

    <div class="statusbar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Ready</span>
    </div>

    <div class="action-bar">
      <span class="hint">Sorted by nearest match · JSON validation · Auto-commit</span>
      <div class="action-btns">
        <button class="btn" onclick="loadFile()">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Load
        </button>
        <button class="btn primary" onclick="saveFile()">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save to GitHub
        </button>
      </div>
    </div>

  </div>
</div>

<script>
const API_URL = "/api/github";
const SOURCE_APIS = [
  "https://yosintvapi.pages.dev/api/match-cricket.json",
  "https://yosintvapi.pages.dev/api/match-football.json"
];

/* ── Required original globals ── */
let allFiles = [];
let matchTimeMap = {};
const password = localStorage.getItem("blog_admin_password") || "";
if (!password) window.location.href = "/admin/login.html";

/* ── Storage helpers ── */
function getSavedFiles() { return JSON.parse(localStorage.getItem("blog_saved_files") || "{}"); }
function markFileSaved(f) { const s = getSavedFiles(); s[f] = Date.now(); localStorage.setItem("blog_saved_files", JSON.stringify(s)); }

function timeAgo(t) {
  if (!t) return "";
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 10) return "just now";
  if (s < 60) return s + "s ago";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
}

function getCurrentTimeText() {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0") + " " +
    String(d.getHours()).padStart(2, "0") + ":" +
    String(d.getMinutes()).padStart(2, "0");
}

function makeAutoCommitMessage(f) { return getCurrentTimeText() + " - " + f; }

function setAutoCommit() {
  const f = document.getElementById("file").value;
  if (!f || f.includes("Loading")) return;
  document.getElementById("commitMessage").value = makeAutoCommitMessage(f);
}

/* ── Status ── */
function setStatus(msg, type) {
  const dot = document.getElementById("statusDot");
  document.getElementById("statusText").innerText = msg;
  dot.className = "status-dot" + (type === "success" ? " ok" : type === "error" ? " err" : "");
}

/* ── Match time helpers ── */
function getFileSortTime(f) {
  const m = matchTimeMap[f];
  if (!m || !m.start) return Number.MAX_SAFE_INTEGER;
  const now = new Date(), start = new Date(m.start);
  const end = new Date(start.getTime() + Number(m.duration || 0) * 3600000);
  if (now >= start && now <= end) return -1;
  if (now < start) return start - now;
  return Number.MAX_SAFE_INTEGER - 1;
}

function formatCountdown(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (d > 0) return d + "d " + h + "h";
  if (h > 0) return h + "h " + m + "m";
  return m + "m " + sec + "s";
}

function getOptionLabel(f) {
  const m = matchTimeMap[f], saved = getSavedFiles(), tick = saved[f] ? " ✅" : "";
  if (!m) return f + tick;
  const now = new Date(), start = new Date(m.start);
  const end = new Date(start.getTime() + Number(m.duration || 0) * 3600000);
  if (now < start) return f + " — Starts in " + formatCountdown(start - now) + tick;
  if (now >= start && now <= end) return f + " — LIVE" + tick;
  return f + " — Over" + tick;
}

/* ── Populate dropdown ── */
function populateFiles(files) {
  const sel = document.getElementById("file"), cur = sel.value;
  const sorted = files.slice().sort((a, b) => getFileSortTime(a) - getFileSortTime(b) || a.localeCompare(b));
  sel.innerHTML = "";
  if (!sorted.length) { sel.innerHTML = '<option value="">No files found</option>'; updateEditorTitle(); return; }
  sorted.forEach(f => { const o = document.createElement("option"); o.value = f; o.textContent = getOptionLabel(f); sel.appendChild(o); });
  if (sorted.includes(cur)) sel.value = cur;
  updateEditorTitle();
  updateMatchBadge();
  setAutoCommit();
}

/* ── Filter ── */
function filterFiles() {
  const q = document.getElementById("searchFile").value.toLowerCase();
  populateFiles(allFiles.filter(f => f.toLowerCase().includes(q)));
}

/* ── Match badge ── */
function updateMatchBadge() {
  const badge = document.getElementById("matchBadge"), f = document.getElementById("file").value;
  if (!f || !matchTimeMap[f]) { badge.innerHTML = ""; return; }
  const m = matchTimeMap[f], now = new Date(), start = new Date(m.start);
  const end = new Date(start.getTime() + Number(m.duration) * 3600000);
  if (now >= start && now <= end) badge.innerHTML = '<span class="match-badge badge-live">Live now</span>';
  else if (now < start) badge.innerHTML = `<span class="match-badge badge-soon">Starts in ${formatCountdown(start - now)}</span>`;
  else badge.innerHTML = '<span class="match-badge badge-over">Ended</span>';
}

/* ── Editor title ── */
function updateEditorTitle() {
  const f = document.getElementById("file").value, saved = getSavedFiles();
  const el = document.getElementById("editorTitle");
  if (!f || f.includes("Loading") || f.includes("No files")) { el.innerText = "—"; return; }
  el.innerText = saved[f] ? f + " · saved " + timeAgo(saved[f]) + " ✅" : f;
}

/* ── Line numbers ── */
function updateLineNumbers() {
  const e = document.getElementById("editor");
  document.getElementById("lineNumbers").textContent =
    Array.from({ length: e.value.split("\n").length }, (_, i) => i + 1).join("\n");
}

function syncScroll() {
  document.getElementById("lineNumbers").scrollTop = document.getElementById("editor").scrollTop;
}

/* ── JSON helpers ── */
function getJsonErrorLine(err, text) {
  const m = err.message.match(/position (\d+)/i);
  if (m) {
    const lines = text.slice(0, Number(m[1])).split("\n");
    return { line: lines.length, column: lines[lines.length - 1].length + 1, message: err.message };
  }
  return { line: null, column: null, message: err.message };
}

function validateJsonLive() {
  const text = document.getElementById("editor").value.trim();
  if (!text) { setStatus("Empty", "info"); return false; }
  try { JSON.parse(text); setStatus("Valid JSON", "success"); return true; }
  catch (e) {
    const err = getJsonErrorLine(e, text);
    setStatus(err.line ? "Error on line " + err.line + ", col " + err.column : "Invalid JSON", "error");
    return false;
  }
}

/* ── Source API helpers ── */
function extractMatches(d) { if (Array.isArray(d)) return d; return d.matches || d.data || d.events || []; }

function extractJsonFile(url) {
  if (!url) return null;
  try { const u = new URL(url), s = u.searchParams.get("yosintv"); return s ? s.trim().replace(/\.json$/i, "") + ".json" : null; }
  catch { return null; }
}

function saveMatchTime(f, item) {
  if (!f || !item.start || !item.duration) return;
  matchTimeMap[f] = { start: item.start, duration: Number(item.duration), team1: item.team1 || item.home || "", team2: item.team2 || item.away || "" };
}

/* ── Load file list ── */
async function loadFileList() {
  setStatus("Loading files...", "info");
  try {
    const found = new Set();
    for (const api of SOURCE_APIS) {
      const res = await fetch(api);
      if (!res.ok) throw new Error("API error: " + api);
      extractMatches(await res.json()).forEach(item => {
        const f = extractJsonFile(item.details_url);
        if (f) { found.add(f); saveMatchTime(f, item); }
      });
    }
    allFiles = Array.from(found).sort((a, b) => getFileSortTime(a) - getFileSortTime(b));
    populateFiles(allFiles);
    setStatus(allFiles.length + " files loaded", "success");
    if (allFiles.length) loadFile();
  } catch (e) { setStatus(e.message, "error"); }
}

/* ── File change ── */
function onFileChange() { updateEditorTitle(); updateMatchBadge(); setAutoCommit(); loadFile(); }

/* ── Load file ── */
async function loadFile() {
  const f = document.getElementById("file").value;
  if (!f || f.includes("Loading") || f.includes("No files")) return;
  setStatus("Loading " + f + "...", "info");
  try {
    const res = await fetch(`${API_URL}?path=${encodeURIComponent(f)}&password=${encodeURIComponent(password)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error || "Load failed");
    document.getElementById("editor").value = JSON.stringify(data.content, null, 2);
    updateLineNumbers();
    validateJsonLive();
    setStatus("Loaded: " + f, "success");
  } catch (e) { setStatus(e.message, "error"); }
}

/* ── Save file ── */
async function saveFile() {
  const f = document.getElementById("file").value, editor = document.getElementById("editor");
  if (!f || f.includes("Loading")) { setStatus("Select a file first", "error"); return; }
  const commitMessage = document.getElementById("commitMessage").value.trim() || makeAutoCommitMessage(f);
  let content;
  try { content = JSON.parse(editor.value); }
  catch (e) { const err = getJsonErrorLine(e, editor.value); setStatus(err.line ? "JSON error on line " + err.line : "Invalid JSON — cannot save", "error"); return; }
  setStatus("Saving...", "info");
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password, path: f, content, message: commitMessage })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error || "Save failed");
    markFileSaved(f);
    populateFiles(allFiles);
    updateEditorTitle();
    setAutoCommit();
    updateLineNumbers();
    validateJsonLive();
    setStatus("Saved: " + f, "success");
  } catch (e) { setStatus(e.message, "error"); }
}

/* ── Toolbar actions ── */
function formatJson() {
  try {
    const e = document.getElementById("editor");
    e.value = JSON.stringify(JSON.parse(e.value), null, 2);
    updateLineNumbers();
    validateJsonLive();
    setStatus("Formatted", "success");
  } catch (e) { setStatus("Invalid JSON", "error"); }
}

function clearEditor() {
  document.getElementById("editor").value = "";
  updateLineNumbers();
  setStatus("Cleared", "info");
}

function logout() {
  localStorage.removeItem("blog_admin_password");
  window.location.href = "/admin/login.html";
}

/* ── Intervals ── */
setInterval(updateEditorTitle, 30000);
setInterval(updateMatchBadge, 1000);
setInterval(() => populateFiles(allFiles), 30000);

/* ── Init ── */
updateLineNumbers();
loadFileList();
</script>

</body>
</html>
