<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YoSinTV Link Manager</title>
<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:#fff;
}

.wrap{
  max-width:1250px;
  margin:auto;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

h1{margin:0;font-size:30px}

.badge{
  background:#22c55e;
  color:#052e16;
  padding:8px 14px;
  border-radius:999px;
  font-weight:800;
}

.admin-link{
  background:#38bdf8;
  color:#082f49;
  padding:8px 14px;
  border-radius:999px;
  font-weight:800;
  text-decoration:none;
}

.card{
  background:#1e293b;
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 12px 35px rgba(0,0,0,.28);
}

.row{display:flex;gap:10px;flex-wrap:wrap}

button,select,input{
  border:0;
  border-radius:12px;
  padding:13px 15px;
  font-size:15px;
}

select,input{background:#334155;color:white}
input{min-width:260px;flex:1}

button{
  background:#22c55e;
  color:#04130a;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  opacity:.9;
  transform:translateY(-1px);
}

.blue{background:#38bdf8;color:#082f49}
.danger{background:#ef4444;color:#fff}
.dark{background:#475569;color:white}

.editor-card{padding:0;overflow:hidden}

.editor-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:#020617;
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:12px 16px;
}

.editor-title{font-weight:800;color:#93c5fd}
.editor-actions{font-size:13px;color:#94a3b8}

.code-editor-wrap{
  display:flex;
  width:100%;
  height:72vh;
  background:#020617;
  overflow:hidden;
}

#lineNumbers{
  margin:0;
  padding:20px 10px;
  min-width:60px;
  text-align:right;
  background:#020617;
  color:#64748b;
  font-family:"SFMono-Regular","Consolas","Liberation Mono",monospace;
  font-size:12.5px;
  line-height:1.5;
  user-select:none;
  overflow:hidden;
  border-right:1px solid rgba(255,255,255,.08);
}

textarea{
  flex:1;
  width:100%;
  height:100%;
  display:block;
  background:#020617;
  color:#d1fae5;
  font-family:"SFMono-Regular","Consolas","Liberation Mono",monospace;
  font-size:12.5px;
  line-height:1.5;
  border:0;
  outline:0;
  padding:20px;
  resize:none;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:normal;
  overflow-x:auto;
  overflow-y:auto;
  tab-size:2;
  caret-color:#22c55e;
}

textarea:focus{box-shadow:inset 0 0 0 2px #22c55e}

#status{margin:0;font-weight:700}
#statusBox{display:none}

.status-flex{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

#matchStatus{
  margin:0;
  font-weight:900;
  color:#facc15;
  white-space:nowrap;
}

.small-note{
  font-size:13px;
  color:#94a3b8;
  margin-top:10px;
}

.footer{
  text-align:center;
  opacity:.6;
  font-size:13px;
  padding-bottom:100px;
}

textarea::-webkit-scrollbar{width:10px;height:10px}
textarea::-webkit-scrollbar-track{background:#020617}
textarea::-webkit-scrollbar-thumb{background:#334155;border-radius:999px}
textarea::-webkit-scrollbar-thumb:hover{background:#475569}

.sticky-actions{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.sticky-actions input{
  min-width:180px;
  padding:14px 16px;
  border:0;
  border-radius:16px;
  background:#1e293b;
  color:white;
  font-size:14px;
  font-weight:700;
  outline:none;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.sticky-actions input::placeholder{color:#94a3b8}

.sticky-actions button{
  min-width:150px;
  padding:15px 18px;
  border-radius:16px;
  border:0;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
  transition:.2s;
}

.sticky-actions button:hover{
  transform:translateY(-2px) scale(1.02);
}

.sticky-load{background:#38bdf8;color:#082f49}
.sticky-save{background:#22c55e;color:#04130a}

@media(max-width:768px){
  .row{flex-direction:column}
  button,select,input{width:100%}
  h1{font-size:24px}
  .code-editor-wrap{height:66vh}
  textarea{font-size:12px;line-height:1.45}
  #lineNumbers{font-size:12px;line-height:1.45;min-width:54px}

  .status-flex{
    flex-direction:column;
    align-items:flex-start;
  }

  #matchStatus{
    white-space:normal;
  }

  .sticky-actions{
    right:14px;
    bottom:14px;
    gap:10px;
  }

  .sticky-actions input{
    min-width:140px;
    padding:12px 14px;
    font-size:13px;
    border-radius:14px;
  }

  .sticky-actions button{
    min-width:120px;
    padding:14px 16px;
    font-size:14px;
    border-radius:14px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <h1>YoSinTV Link Manager</h1>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <a class="admin-link" href="https://sofax3.vercel.app/" target="_blank">Match List Admin</a>
    </div>
  </div>

  <div class="card">
    <div class="row">

      <select id="file">
        <option>Loading active JSON files...</option>
      </select>

      <input
        type="text"
        id="searchFile"
        placeholder="Search active JSON file..."
        oninput="filterFiles()"
      />

      <input
        type="text"
        id="commitMessage"
        placeholder="Auto commit note..."
      />

      <button class="blue" onclick="formatJson()">Format</button>
      <button class="danger" onclick="clearEditor()">Clear</button>
      <button class="dark" onclick="logout()">Logout</button>

    </div>

    <div class="small-note">
      ✅ Files are sorted by nearest upcoming match first · Countdown · Line numbers · JSON validator
    </div>
  </div>

  <div id="statusBox" class="card status-flex">
    <p id="status">Ready</p>
    <p id="matchStatus">Checking match time...</p>
  </div>

  <div class="card editor-card">

    <div class="editor-top">
      <div class="editor-title" id="editorTitle">
        Select JSON file
      </div>

      <div class="editor-actions">
        Line Numbers · JSON Validator · GitHub Save
      </div>
    </div>

    <div class="code-editor-wrap">

      <pre id="lineNumbers">1</pre>

      <textarea
        id="editor"
        spellcheck="false"
        placeholder="Select and load JSON file..."
        oninput="updateLineNumbers(); validateJsonLive();"
        onscroll="syncScroll()"
      ></textarea>

    </div>

  </div>

  <div class="footer"></div>

</div>

<div class="sticky-actions">

  <input
    type="text"
    id="floatingSearch"
    placeholder="Search file..."
    oninput="floatingSearchFiles()"
  />

  <button class="sticky-load" onclick="loadFile()">
    📂 Load
  </button>

  <button class="sticky-save" onclick="saveFile()">
    💾 Save
  </button>

</div>

<script>
const API_URL = "/api/github";

const SOURCE_APIS = [
  "https://yosintvapi.pages.dev/api/match-cricket.json",
  "https://yosintvapi.pages.dev/api/match-football.json"
];

let allFiles = [];
let matchTimeMap = {};

const password = localStorage.getItem("blog_admin_password");

if(!password){
  window.location.href = "/admin/login.html";
}

function getSavedFiles(){
  return JSON.parse(localStorage.getItem("blog_saved_files") || "{}");
}

function markFileSaved(file){
  const saved = getSavedFiles();
  saved[file] = Date.now();
  localStorage.setItem("blog_saved_files", JSON.stringify(saved));
}

function timeAgo(timestamp){
  if(!timestamp) return "";

  const seconds = Math.floor((Date.now() - timestamp) / 1000);

  if(seconds < 10) return "just now";
  if(seconds < 60) return `${seconds} seconds ago`;

  const minutes = Math.floor(seconds / 60);
  if(minutes < 60) return `${minutes} minute${minutes > 1 ? "s" : ""} ago`;

  const hours = Math.floor(minutes / 60);
  if(hours < 24) return `${hours} hour${hours > 1 ? "s" : ""} ago`;

  const days = Math.floor(hours / 24);
  return `${days} day${days > 1 ? "s" : ""} ago`;
}

function getCurrentTimeText(){
  const d = new Date();

  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0");
  const min = String(d.getMinutes()).padStart(2,"0");

  return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
}

function makeAutoCommitMessage(file){
  return `${getCurrentTimeText()} - ${file}`;
}

function setAutoCommit(){
  const file = document.getElementById("file").value;

  if(!file || file.includes("Loading")) return;

  document.getElementById("commitMessage").value =
    makeAutoCommitMessage(file);
}

function setStatus(msg,type="info"){
  const status = document.getElementById("status");
  const box = document.getElementById("statusBox");

  box.style.display = "flex";
  status.innerText = msg;

  if(type === "success"){
    box.style.background = "#052e16";
    box.style.borderColor = "#16a34a";
    status.style.color = "#86efac";
  }
  else if(type === "error"){
    box.style.background = "#450a0a";
    box.style.borderColor = "#dc2626";
    status.style.color = "#fca5a5";
  }
  else{
    box.style.background = "#1e293b";
    box.style.borderColor = "rgba(255,255,255,.08)";
    status.style.color = "#e2e8f0";
  }

  updateMatchStatus();
}

function updateEditorTitle(){
  const file = document.getElementById("file").value;
  const saved = getSavedFiles();

  if(saved[file]){
    document.getElementById("editorTitle").innerText =
      `Editing: ${file} ✅ - link updated ${timeAgo(saved[file])}`;
  }else{
    document.getElementById("editorTitle").innerText =
      "Editing: " + file;
  }
}

function updateLineNumbers(){
  const editor = document.getElementById("editor");
  const lineNumbers = document.getElementById("lineNumbers");

  const lines = editor.value.split("\n").length;

  lineNumbers.textContent = Array.from(
    {length: lines},
    (_, i) => i + 1
  ).join("\n");
}

function syncScroll(){
  const editor = document.getElementById("editor");
  const lineNumbers = document.getElementById("lineNumbers");

  lineNumbers.scrollTop = editor.scrollTop;
}

function getJsonErrorLine(error,text){
  const msg = error.message;
  const posMatch = msg.match(/position (\d+)/i);

  if(posMatch){
    const pos = Number(posMatch[1]);
    const before = text.slice(0,pos);
    const lines = before.split("\n");
    const line = lines.length;
    const column = lines[lines.length - 1].length + 1;

    return {line,column,message:msg};
  }

  return {line:null,column:null,message:msg};
}

function validateJsonLive(){
  const editor = document.getElementById("editor");
  const text = editor.value.trim();

  if(!text){
    setStatus("Editor is empty","info");
    return false;
  }

  try{
    JSON.parse(text);
    setStatus("✅ Valid JSON","success");
    return true;
  }catch(e){
    const err = getJsonErrorLine(e,text);

    if(err.line){
      setStatus(
        `❌ JSON Error on line ${err.line}, column ${err.column}: ${err.message}`,
        "error"
      );
    }else{
      setStatus(
        `❌ JSON Error: ${err.message}`,
        "error"
      );
    }

    return false;
  }
}

function getFileSortTime(file){
  const match = matchTimeMap[file];

  if(!match || !match.start){
    return Number.MAX_SAFE_INTEGER;
  }

  const now = new Date();
  const start = new Date(match.start);
  const end = new Date(start.getTime() + Number(match.duration || 0) * 60 * 60 * 1000);

  if(now >= start && now <= end){
    return -1;
  }

  if(now < start){
    return start.getTime() - now.getTime();
  }

  return Number.MAX_SAFE_INTEGER - 1;
}

function sortFilesByMatchTime(files){
  return files.slice().sort((a,b) => {
    const ta = getFileSortTime(a);
    const tb = getFileSortTime(b);

    if(ta !== tb) return ta - tb;

    return a.localeCompare(b);
  });
}

function getOptionLabel(file){
  const match = matchTimeMap[file];
  const saved = getSavedFiles();
  const tick = saved[file] ? " ✅" : "";

  if(!match){
    return `${file}${tick}`;
  }

  const now = new Date();
  const start = new Date(match.start);
  const end = new Date(start.getTime() + Number(match.duration || 0) * 60 * 60 * 1000);

  if(now < start){
    return `${file} — ${formatCountdown(start - now)}${tick}`;
  }

  if(now >= start && now <= end){
    return `${file} — LIVE NOW${tick}`;
  }

  return `${file} — Match Over${tick}`;
}

function populateFiles(files){
  const select = document.getElementById("file");
  const currentValue = select.value;

  const sortedFiles = sortFilesByMatchTime(files);

  select.innerHTML = "";

  if(!sortedFiles.length){
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "No active JSON files found";
    select.appendChild(opt);
    updateEditorTitle();
    updateMatchStatus();
    return;
  }

  sortedFiles.forEach(file => {
    const opt = document.createElement("option");
    opt.value = file;
    opt.textContent = getOptionLabel(file);
    select.appendChild(opt);
  });

  if(sortedFiles.includes(currentValue)){
    select.value = currentValue;
  }

  updateEditorTitle();
  updateMatchStatus();
  setAutoCommit();
}

function refreshDropdownLabels(){
  const currentFiles = Array.from(document.getElementById("file").options)
    .map(opt => opt.value)
    .filter(Boolean);

  if(currentFiles.length){
    populateFiles(currentFiles);
  }
}

function filterFiles(){
  const q = document.getElementById("searchFile").value.toLowerCase();

  const filtered = allFiles.filter(file =>
    file.toLowerCase().includes(q)
  );

  populateFiles(filtered);
}

function floatingSearchFiles(){
  const q = document.getElementById("floatingSearch").value.toLowerCase();

  const filtered = allFiles.filter(file =>
    file.toLowerCase().includes(q)
  );

  populateFiles(filtered);
}

function extractMatches(data){
  if(Array.isArray(data)) return data;
  if(Array.isArray(data.matches)) return data.matches;
  if(Array.isArray(data.data)) return data.data;
  if(Array.isArray(data.events)) return data.events;
  return [];
}

function extractJsonFileFromDetailsUrl(detailsUrl){
  if(!detailsUrl) return null;

  try{
    const u = new URL(detailsUrl);
    const slug = u.searchParams.get("yosintv");

    if(!slug) return null;

    return slug.trim().replace(/\.json$/i,"") + ".json";
  }catch(e){
    return null;
  }
}

function saveMatchTime(file,item){
  if(!file || !item.start || !item.duration) return;

  matchTimeMap[file] = {
    start:item.start,
    duration:Number(item.duration),
    team1:item.team1 || item.home || item.homeTeam || "",
    team2:item.team2 || item.away || item.awayTeam || ""
  };
}

async function loadFileList(){
  setStatus("Loading active JSON files...","info");

  try{
    const found = new Set();

    for(const api of SOURCE_APIS){
      const res = await fetch(api);

      if(!res.ok){
        throw new Error("Could not load source API");
      }

      const data = await res.json();
      const matches = extractMatches(data);

      matches.forEach(item => {
        const file = extractJsonFileFromDetailsUrl(item.details_url);

        if(file){
          found.add(file);
          saveMatchTime(file,item);
        }
      });
    }

    allFiles = sortFilesByMatchTime(Array.from(found));

    populateFiles(allFiles);

    setStatus(`✅ Loaded ${allFiles.length} active JSON files`,"success");

    if(allFiles.length){
      loadFile();
    }

  }catch(e){
    setStatus("❌ " + e.message,"error");
  }
}

function updateMatchStatus(){
  const matchBox = document.getElementById("matchStatus");
  const file = document.getElementById("file").value;

  if(!matchBox || !file || file.includes("Loading") || file.includes("No active")){
    if(matchBox) matchBox.innerText = "";
    return;
  }

  const match = matchTimeMap[file];

  if(!match){
    matchBox.innerText = "";
    return;
  }

  const now = new Date();
  const start = new Date(match.start);
  const end = new Date(start.getTime() + Number(match.duration) * 60 * 60 * 1000);

  if(isNaN(start.getTime()) || isNaN(end.getTime())){
    matchBox.innerText = "";
    return;
  }

  if(now < start){
    const diff = start - now;
    matchBox.innerText = "⏳ Starts in " + formatCountdown(diff);
    matchBox.style.color = "#facc15";
  }
  else if(now >= start && now <= end){
    matchBox.innerText = "🔴 LIVE NOW";
    matchBox.style.color = "#22c55e";
  }
  else{
    matchBox.innerText = "✅ Match Over";
    matchBox.style.color = "#94a3b8";
  }
}

function formatCountdown(ms){
  const totalSeconds = Math.max(0,Math.floor(ms / 1000));
  const days = Math.floor(totalSeconds / 86400);
  const h = Math.floor((totalSeconds % 86400) / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;

  if(days > 0){
    return `${days}d ${h}h ${m}m`;
  }

  if(h > 0){
    return `${h}h ${m}m ${s}s`;
  }

  return `${m}m ${s}s`;
}

document.getElementById("file").addEventListener("change",function(){
  updateEditorTitle();
  updateMatchStatus();
  setAutoCommit();
  loadFile();
});

async function loadFile(){
  const file = document.getElementById("file").value;

  if(!file || file.includes("Loading") || file.includes("No active")) return;

  updateEditorTitle();
  updateMatchStatus();
  setAutoCommit();

  setStatus("Loading " + file + "...","info");

  try{
    const res = await fetch(
      `${API_URL}?path=${encodeURIComponent(file)}&password=${encodeURIComponent(password)}`
    );

    const data = await res.json();

    if(!res.ok){
      throw new Error(
        data.message ||
        data.error ||
        "Load failed"
      );
    }

    const editor = document.getElementById("editor");

    editor.value = JSON.stringify(data.content,null,2);

    updateLineNumbers();
    validateJsonLive();

    setStatus("✅ Loaded successfully: " + file,"success");

  }catch(e){
    setStatus("❌ " + e.message,"error");
  }
}

async function saveFile(){
  const file = document.getElementById("file").value;
  const editor = document.getElementById("editor");

  if(!file || file.includes("Loading") || file.includes("No active")){
    setStatus("❌ Please select a valid JSON file.","error");
    return;
  }

  const commitMessage =
    document.getElementById("commitMessage").value.trim()
    || makeAutoCommitMessage(file);

  let content;

  try{
    content = JSON.parse(editor.value);
  }catch(e){
    const err = getJsonErrorLine(e,editor.value);

    if(err.line){
      setStatus(
        `❌ Cannot save. JSON error on line ${err.line}, column ${err.column}: ${err.message}`,
        "error"
      );
    }else{
      setStatus(
        `❌ Cannot save. JSON error: ${err.message}`,
        "error"
      );
    }

    return;
  }

  setStatus("Saving to GitHub...","info");

  try{
    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        password,
        path:file,
        content,
        message:commitMessage
      })
    });

    const data = await res.json();

    if(!res.ok){
      throw new Error(
        data.message ||
        data.error ||
        "Save failed"
      );
    }

    markFileSaved(file);

    const q = document.getElementById("searchFile").value.toLowerCase();

    populateFiles(
      q
      ? allFiles.filter(f => f.toLowerCase().includes(q))
      : allFiles
    );

    updateEditorTitle();
    updateMatchStatus();
    setAutoCommit();
    updateLineNumbers();
    validateJsonLive();

    setStatus("✅ Saved successfully: " + file,"success");

  }catch(e){
    setStatus("❌ " + e.message,"error");
  }
}

function formatJson(){
  try{
    const editor = document.getElementById("editor");
    const json = JSON.parse(editor.value);

    editor.value = JSON.stringify(json,null,2);

    updateLineNumbers();
    validateJsonLive();

    setStatus("✅ JSON formatted successfully","success");

  }catch(e){
    const err = getJsonErrorLine(e,document.getElementById("editor").value);

    if(err.line){
      setStatus(
        `❌ JSON Error on line ${err.line}, column ${err.column}: ${err.message}`,
        "error"
      );
    }else{
      setStatus("❌ Invalid JSON","error");
    }
  }
}

function clearEditor(){
  document.getElementById("editor").value = "";
  updateLineNumbers();
  setStatus("Editor cleared","info");
}

function logout(){
  localStorage.removeItem("blog_admin_password");
  window.location.href = "/admin/login.html";
}

setInterval(updateEditorTitle,30000);
setInterval(updateMatchStatus,1000);
setInterval(refreshDropdownLabels,30000);

updateLineNumbers();
loadFileList();
</script>

</body>
</html>
