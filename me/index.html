<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>YoSin Notes</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#020617;
  color:white;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:14px;
}

.header{
  margin-bottom:14px;
}

.title{
  font-size:28px;
  font-weight:900;
  margin:0;
}

.subtitle{
  margin-top:5px;
  color:#94a3b8;
  font-size:13px;
}

.top-card{
  background:#0f172a;
  border:1px solid rgba(255,255,255,.06);
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

select,
input,
button{
  border:0;
  outline:0;
  border-radius:14px;
  padding:14px;
  font-size:15px;
}

select,
input{
  background:#1e293b;
  color:white;
}

input{
  flex:1;
  min-width:160px;
}

button{
  background:#22c55e;
  color:#04130a;
  font-weight:900;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

#statusBox{
  display:none;
  margin-bottom:14px;
}

.status{
  background:#0f172a;
  border-radius:18px;
  padding:14px;
  font-size:14px;
  font-weight:700;
}

.editor-card{
  background:#0f172a;
  border-radius:20px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
}

.editor-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:#020617;
}

.editor-title{
  font-weight:900;
  color:#93c5fd;
  font-size:14px;
}

.save-info{
  font-size:12px;
  color:#94a3b8;
}

.editor-wrap{
  display:flex;
  height:72vh;
  overflow:hidden;
}

#lineNumbers{
  margin:0;
  padding:18px 10px;
  min-width:50px;
  text-align:right;
  background:#020617;
  color:#475569;
  border-right:1px solid rgba(255,255,255,.05);
  font-size:12px;
  line-height:1.6;
  font-family:monospace;
  overflow:hidden;
  user-select:none;
}

textarea{
  flex:1;
  width:100%;
  height:100%;
  border:0;
  outline:none;
  box-shadow:none;
  resize:none;
  padding:18px;
  background:#020617;
  color:#e2e8f0;
  font-size:14px;
  line-height:1.7;
  font-family:monospace;
  overflow:auto;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  -webkit-appearance:none;
}

textarea:focus{
  outline:none;
  box-shadow:none;
}

textarea::placeholder{
  color:#64748b;
}

.sticky-actions{
  position:fixed;
  right:14px;
  bottom:14px;
  z-index:999;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.sticky-actions input{
  width:150px;
  background:#1e293b;
  color:white;
  border:0;
  border-radius:14px;
  padding:13px;
  font-size:13px;
  outline:none;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.sticky-actions button{
  min-width:130px;
  padding:14px;
  border-radius:16px;
  border:0;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.load-btn{
  background:#38bdf8;
  color:#082f49;
}

.save-btn{
  background:#22c55e;
  color:#04130a;
}

textarea::-webkit-scrollbar{
  width:8px;
  height:8px;
}

textarea::-webkit-scrollbar-thumb{
  background:#334155;
  border-radius:999px;
}

@media(max-width:768px){

  .wrap{
    padding:10px;
  }

  .title{
    font-size:24px;
  }

  .row{
    flex-direction:column;
  }

  select,
  input,
  button{
    width:100%;
  }

  .editor-wrap{
    height:76vh;
  }

  textarea{
    font-size:13px;
    line-height:1.6;
    padding:14px;
  }

  #lineNumbers{
    padding:14px 8px;
    min-width:42px;
    font-size:11px;
  }

  .sticky-actions{
    right:10px;
    bottom:10px;
  }

  .sticky-actions input{
    width:130px;
    font-size:12px;
    padding:12px;
  }

  .sticky-actions button{
    min-width:110px;
    padding:13px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <h1 class="title">YoSin Notes</h1>
    <div class="subtitle">
      Personal cloud notes synced with GitHub
    </div>
  </div>

  <div class="top-card">

    <div class="row">

      <select id="file">
        <option value="shopping.json">Shopping</option>
        <option value="todo.json">Todo</option>
        <option value="cricket.json">Cricket</option>
        <option value="football.json">Football</option>
      </select>

      <input
        type="text"
        id="commitMessage"
        placeholder="Update note..."
      />

    </div>

  </div>

  <div id="statusBox">
    <div class="status" id="status">
      Ready
    </div>
  </div>

  <div class="editor-card">

    <div class="editor-top">

      <div class="editor-title" id="editorTitle">
        Shopping
      </div>

      <div class="save-info" id="saveInfo">
        Ready
      </div>

    </div>

    <div class="editor-wrap">

      <pre id="lineNumbers">1</pre>

      <textarea
        id="editor"
        spellcheck="false"
        placeholder="Write your notes here..."
        oninput="updateLineNumbers()"
        onscroll="syncScroll()"
      ></textarea>

    </div>

  </div>

</div>

<div class="sticky-actions">

  <input
    type="text"
    id="floatingSearch"
    placeholder="Search note..."
    oninput="searchFiles()"
  />

  <button class="load-btn" onclick="loadFile()">
    📂 Load
  </button>

  <button class="save-btn" onclick="saveFile()">
    💾 Save
  </button>

</div>

<script>
const API_URL = "/api/me-github";

const password = localStorage.getItem("blog_admin_password") || "";

let saveTimes = {};

const labelMap = {
  "shopping.json":"Shopping",
  "todo.json":"Todo",
  "cricket.json":"Cricket",
  "football.json":"Football"
};

function getFileLabel(file){
  return labelMap[file] || file.replace(".json","");
}

function setStatus(message,type="info"){

  const box = document.getElementById("statusBox");
  const status = document.getElementById("status");

  box.style.display = "block";
  status.innerText = message;

  if(type === "success"){
    status.style.background = "#052e16";
    status.style.color = "#86efac";
  }
  else if(type === "error"){
    status.style.background = "#450a0a";
    status.style.color = "#fca5a5";
  }
  else{
    status.style.background = "#0f172a";
    status.style.color = "#e2e8f0";
  }
}

function updateLineNumbers(){

  const editor = document.getElementById("editor");
  const lineNumbers = document.getElementById("lineNumbers");

  const lines = editor.value.split("\n").length;

  lineNumbers.textContent =
    Array.from({length:lines},(_,i)=>i+1).join("\n");
}

function syncScroll(){
  document.getElementById("lineNumbers").scrollTop =
    document.getElementById("editor").scrollTop;
}

function timeAgo(timestamp){

  if(!timestamp) return "Ready";

  const seconds = Math.floor((Date.now()-timestamp)/1000);

  if(seconds < 10) return "Updated just now";
  if(seconds < 60) return `Updated ${seconds}s ago`;

  const minutes = Math.floor(seconds/60);
  if(minutes < 60) return `Updated ${minutes}m ago`;

  const hours = Math.floor(minutes/60);
  if(hours < 24) return `Updated ${hours}h ago`;

  const days = Math.floor(hours/24);
  return `Updated ${days}d ago`;
}

function updateSaveInfo(){

  const file = document.getElementById("file").value;

  document.getElementById("saveInfo").innerText =
    timeAgo(saveTimes[file]);
}

function updateEditorTitle(){

  const file = document.getElementById("file").value;

  document.getElementById("editorTitle").innerText =
    getFileLabel(file);
}

function getCurrentHHMM(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return `${hh}:${mm}`;
}

function autoCommitText(){

  const file = document.getElementById("file").value;

  document.getElementById("commitMessage").value =
    `${getCurrentHHMM()} - ${getFileLabel(file)}`;
}

function searchFiles(){

  const q = document.getElementById("floatingSearch").value.toLowerCase();
  const select = document.getElementById("file");

  for(let option of select.options){
    if(option.text.toLowerCase().includes(q)){
      select.value = option.value;
      updateEditorTitle();
      autoCommitText();
      return;
    }
  }
}

async function loadFile(){

  const file = document.getElementById("file").value;

  updateEditorTitle();
  autoCommitText();

  setStatus(`Loading ${getFileLabel(file)}...`,"info");

  try{

    const res = await fetch(
      `${API_URL}?file=${encodeURIComponent(file)}&password=${encodeURIComponent(password)}`
    );

    const data = await res.json();

    if(!res.ok){
      throw new Error(data.message || data.error || "Load failed");
    }

    document.getElementById("editor").value =
      data.content || "";

    updateLineNumbers();

    setStatus(
      `${timeAgo(saveTimes[file])}`,
      "success"
    );

  }catch(e){

    setStatus(`❌ ${e.message}`,"error");

  }
}

async function saveFile(){

  const file = document.getElementById("file").value;
  const label = getFileLabel(file);

  const content = document.getElementById("editor").value;

  const message =
    document.getElementById("commitMessage").value.trim()
    || `${getCurrentHHMM()} - ${label}`;

  setStatus(`Saving ${label}...`,"info");

  try{

    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        password,
        file,
        content,
        message
      })
    });

    const data = await res.json();

    if(!res.ok){
      throw new Error(data.message || data.error || "Save failed");
    }

    saveTimes[file] = Date.now();

    updateSaveInfo();

    setStatus(
      timeAgo(saveTimes[file]),
      "success"
    );

  }catch(e){

    setStatus(`❌ ${e.message}`,"error");

  }
}

document.getElementById("file")
.addEventListener("change",()=>{

  updateEditorTitle();
  autoCommitText();
  loadFile();

});

setInterval(updateSaveInfo,1000);

updateLineNumbers();
updateEditorTitle();
autoCommitText();
loadFile();
</script>

</body>
</html>
