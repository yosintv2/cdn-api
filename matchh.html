        .h2h-val {

            color: #111827;
        }

        .h2h-label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .neo-wrap { background: linear-gradient(145deg,#f8fbff,#eef5ff); border:1px solid #dbeafe; border-radius:16px; padding:16px; }
        .neo-title { font-weight: 900; font-size: 1.2rem; color:#0f172a; letter-spacing:-0.02em; }
        .kv-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:10px; }
        .kv { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:10px; }
        .kv b { display:block; font-size:11px; color:#475569; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
        .kv span { font-size:14px; color:#0f172a; font-weight:700; }
        .pill-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
        .pill { padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid #dbeafe; background:#f8fbff; color:#1e3a8a; }
        .team-col { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:12px; }
        .team-col h5 { font-weight:800; color:#111827; margin-bottom:8px; }
        .mini-list { font-size:13px; color:#334155; line-height:1.55; }
        .mini-list li { margin-bottom:3px; }
        .form-chip { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:999px; font-size:12px; font-weight:800; color:#fff; }
        .form-W { background:#10b981; }
        .form-L { background:#ef4444; }
        .form-D { background:#6b7280; }
        .faq-card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:12px; }
        .faq-card h4 { font-weight:800; color:#111827; margin-bottom:6px; }
        .progress-shell { background:#e2e8f0; border-radius:999px; height:26px; overflow:hidden; position:relative; }
        .progress-fill { height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,#ef4444,#f97316,#ef4444); background-size:200% 100%; animation:flow 2s linear infinite; transition:width .8s ease; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:12px; }
        .timer-text { font-weight:800; color:#334155; text-align:center; margin-bottom:8px; animation:pulseTxt 1.6s ease-in-out infinite; }
        .mobile-switch { display:none; gap:8px; margin:10px 0; }
        .switch-btn { border:1px solid #cbd5e1; background:#fff; padding:7px 10px; border-radius:10px; font-size:12px; font-weight:700; color:#0f172a; }
        .switch-btn.active { background:#0f172a; color:#fff; border-color:#0f172a; }
        .switch-panel.hidden { display:none; }
        @keyframes flow { from { background-position:0% 0; } to { background-position:200% 0; } }
        @keyframes pulseTxt { 0%,100% { opacity:1; } 50% { opacity:.65; } }
        @media (max-width: 768px) {
            .kv-grid { grid-template-columns:1fr; }
            .mobile-switch { display:flex; }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                requestAnimationFrame(async () => {
                    const normalize = s => s.toString().toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/&/g, 'and').replace(/[^a-z0-9]/g, '');

                    // --- formatTime FUNCTION ---
                    const formatTime = (iso, type) => {
                        try {
                            const d = new Date(iso);
                            if (type === 'full') {
                                const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
                                return d.toLocaleString(undefined, options);
                            }
                            return {
                                day: d.toLocaleString(undefined, { weekday: 'long' }),
                                date: d.toLocaleString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }),
                                time: d.toLocaleString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true })
                            };
                        } catch (e) {
                            return type === 'full' ? 'Invalid Time' : { day: 'N/A', date: 'N/A', time: 'N/A' };
                        }
                    };

                    const mainApis = [
                        'https://yosintv-api.pages.dev/api/cricket.json',
                        'https://yosintv-api.pages.dev/api/footballl.json'
                    ];

                    const urlParams = new URLSearchParams(window.location.search);
                    const slug = urlParams.get('yosintv'); // Slug from URL

                    if (!slug) {
                        document.getElementById('match-name').textContent = 'No Match Selected';
                        return;
                    }

                    const searchKey = normalize(slug);
                    let match = null;

                    // 1. Fetch Main Match Info (Metadata)
                    for (const api of mainApis) {
                        try {
                            const res = await fetch(api);
                            if (!res.ok) continue;
                            const json = await res.json();
                            const foundMatch = (json.matches || []).find(m => {
                                const fullMatchName = normalize(m.team1 + 'vs' + m.team2);
                                const team1Name = normalize(m.team1);
                                const team2Name = normalize(m.team2);
                                const isDetailsUrlMatch = m.details_url && normalize(m.details_url).includes(`yosintv${searchKey}`);
                                return fullMatchName.includes(searchKey) || team1Name.includes(searchKey) || team2Name.includes(searchKey) || isDetailsUrlMatch;
                            });
                            if (foundMatch) {
                                match = foundMatch;
                                break;
                            }
                        } catch (e) { }
                    }

                    if (!match) {
                        document.getElementById('match-name').textContent = 'Match Not Available';
                        document.getElementById('match-info').innerHTML = '<p class="text-red-600 text-center">This match is not live right now.</p>';
                        return;
                    }

                    const { team1, team2, start, duration, details_url, lineup_image_url, league } = match;
                    const matchName = `${team1.trim()} vs ${team2.trim()}`;
                    const startTimeFull = formatTime(start, 'full');

                    // SEO & Meta
                    document.title = `YoSinTV - ${matchName} Live Stream`;
                    document.getElementById('meta-description').content = `Watch ${matchName} live stream on YoSinTV`;
                    document.getElementById('og-title').content = document.title;
                    document.getElementById('og-url').content = location.href;
                    document.getElementById('canonical-url').href = location.href;

                    // Display Info
                    document.getElementById('match-name').textContent = `${matchName}`;
                    document.getElementById('home-team-name').textContent = team1;
                    document.getElementById('away-team-name').textContent = team2;

                    // Lineup Image
                    const lineupImageContainer = document.getElementById('lineup-image-container');
                    if (lineup_image_url) {
                        lineupImageContainer.innerHTML = `
            <div class="bg-gray-50 p-3 rounded-lg shadow-sm border border-gray-200">
              <p class="text-center text-sm text-gray-700 font-semibold mb-2">Predicted Lineup/Preview Image</p>
              <img src="${lineup_image_url}" alt="${matchName} Lineup Preview" class="w-full h-auto object-cover rounded-md border border-gray-300" onerror="this.onerror=null; this.src='https://placehold.co/600x400/ccc/000?text=Lineup+Image+Not+Available';" />
            </div>`;
                    } else {
                        lineupImageContainer.innerHTML = '';
                    }

                    // 2. Fetch stream links with multi-source fallback
                    let extraData = {};
                    const streamSources = [
                        `https://www.yosintv.net/${slug}.json`,
                        `https://blog.cricfoot.net/${slug}.json`
                    ];
                    const liveContainer = document.getElementById('live-container');

                    try {
                        for (const src of streamSources) {
                            try {
                                const r = await fetch(src);
                                if (!r.ok) continue;
                                const j = await r.json();
                                if (j && j.events && Array.isArray(j.events) && j.events.length > 0) {
                                    extraData = j;
                                    break;
                                }
                            } catch (e) {}
                        }

                        // Helper to get data from either source (Priority: extraData -> match)
                        const getVal = (k) => (extraData && extraData[k]) || (match && match[k]);

                        // Stadium
                        const stadium = getVal('stadium');
                        if (stadium && stadium !== "Unknown") {
                            document.getElementById('stadium-val').textContent = stadium;
                            document.getElementById('stadium-info').classList.remove('hidden');
                            document.getElementById('info-bar').classList.remove('hidden');
                        }

                        // Referee
                        const referee = getVal('referee');
                        if (referee && referee !== "Unknown") {
                            document.getElementById('referee-val').textContent = referee;
                            document.getElementById('referee-info').classList.remove('hidden');
                            document.getElementById('info-bar').classList.remove('hidden');
                        }

                        const dynamicDiv = document.getElementById('dynamic-details');

                        // H2H
                        const h2h = getVal('h2h');
                        // Handle both object {summary:[]} (old) and array [] (new) formats if mixed
                        const h2hData = (h2h && h2h.summary) ? h2h.summary : h2h;

                        if (h2hData && Array.isArray(h2hData) && h2hData.length >= 3) {
                            document.getElementById('h2h-win').textContent = h2hData[0];
                            document.getElementById('h2h-draw').textContent = h2hData[1];
                            document.getElementById('h2h-loss').textContent = h2hData[2];
                            document.getElementById('h2h-section').classList.remove('hidden');
                            dynamicDiv.classList.remove('hidden');
                        }

                        // Lineups
                        const homeLineup = getVal('home_lineup');
                        if (homeLineup && Array.isArray(homeLineup) && homeLineup.length > 0) {
                            const hList = document.getElementById('home-lineup-list');
                            hList.innerHTML = '';
                            homeLineup.forEach(player => {
                                hList.innerHTML += `<li>${player}</li>`;
                            });
                            document.getElementById('lineups-section').classList.remove('hidden');
                            dynamicDiv.classList.remove('hidden');
                        }

                        const awayLineup = getVal('away_lineup');
                        if (awayLineup && Array.isArray(awayLineup) && awayLineup.length > 0) {
                            const aList = document.getElementById('away-lineup-list');
                            aList.innerHTML = '';
                            awayLineup.forEach(player => {
                                aList.innerHTML += `<li>${player}</li>`;
                            });
                            document.getElementById('lineups-section').classList.remove('hidden');
                            dynamicDiv.classList.remove('hidden');
                        }

                        if (extraData.events) {
                            const baseStyle = extraData.styles?.livee || "display:flex;justify-content:center;align-items:center;margin:12px 0;padding:15px;border-radius:8px;background:#d00;color:#fff;font-weight:bold;font-size:18px;cursor:pointer;text-decoration:none;";
                            const hoverStyle = extraData.styles?.liveeHover || "box-shadow:0 6px 15px rgba(0,0,0,0.4);";

                            extraData.events.forEach(event => {
                                const links = event.links || (event.link ? [event.link] : []);
                                if (links.length === 0) return;

                                links.forEach((link, i) => {
                                    const a = document.createElement('a');
                                    a.href = link;
                                    a.target = "_blank";
                                    a.style.cssText = baseStyle;
                                    a.onmouseover = () => a.style.cssText = baseStyle + hoverStyle;
                                    a.onmouseout = () => a.style.cssText = baseStyle;
                                    a.innerHTML = `${event.name ? event.name.replace(/India vs SA|IND vs SA/g, matchName) : 'Watch Live'} ${links.length > 1 ? `- Link ${i + 1}` : ''}`;
                                    liveContainer.appendChild(a);
                                });
                            });
                        } else {
                            liveContainer.innerHTML = '<p class="text-center text-orange-600 font-bold">Stream links loading soon...</p>';
                        }

                    } catch (e) {
                        console.log("Could not fetch stream json", e);
                        liveContainer.innerHTML = '<p class="text-center text-orange-600 font-bold">Stream links loading soon...</p>';
                    }

                    // Better progress bar animation
                    const progContainer = document.createElement('div');
                    progContainer.className = 'progress-shell mb-4';
                    const progBar = document.createElement('div');
                    progBar.className = 'progress-fill';
                    const progText = document.createElement('div');
                    progText.className = 'timer-text';
                    progContainer.appendChild(progBar);
                    document.getElementById('live-tracker').appendChild(progText); // Append to specific div
                    document.getElementById('live-tracker').appendChild(progContainer);

                    const updateProgress = () => {
                        const now = Date.now();
                        const startMs = new Date(start).getTime();
                        const endMs = startMs + duration * 3600000;
                        const diff = now - startMs;

                        if (diff < 0) {
                            const m = Math.abs(Math.floor(diff / 60000));
                            progText.textContent = `Starts in: ${Math.floor(m / 60)}h ${m % 60}m`;
                            progBar.style.width = '0%';
                            progBar.textContent = '';
                        } else if (diff > endMs - startMs) {
                            progText.textContent = 'Match Ended';
                            progBar.style.width = '100%';
                            progBar.textContent = 'FULL TIME';
                        } else {
                            const perc = (diff / (duration * 3600000)) * 100;
                            const h = Math.floor(diff / 3600000);
                            const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
                            const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
                            progText.textContent = `Match Playing Time: ${h}:${m}:${s} / ${duration}:00:00`;
                            progBar.style.width = perc + '%';
                            progBar.textContent = `${Math.floor(perc)}%`;
                        }
                    };

                    updateProgress();
                    setInterval(updateProgress, 1000);

                    // Football enrich: event + h2h + lineups + pregame_form
                    const getFootballData = async () => {
                        if (match.football_data) return match.football_data;
                        if (!match.event_id) return null;
                        const base = 'https://api.sofascore.com/api/v1/event/';
                        try {
                            const [evR, h2hR, lineR, preR] = await Promise.all([
                                fetch(`${base}${match.event_id}`),
                                fetch(`${base}${match.event_id}/h2h`),
                                fetch(`${base}${match.event_id}/lineups`),
                                fetch(`${base}${match.event_id}/pregame-form`)
                            ]);
                            const [evD, h2hD, lineD, preD] = await Promise.all([
                                evR.json(),
                                h2hR.json(),
                                lineR.json(),
                                preR.json().catch(() => ({}))
                            ]);
                            const ev = evD?.event || {};
                            return {
                                event: {
                                    league: ev?.tournament?.name || league || 'N/A',
                                    round: ev?.roundInfo?.round || 'N/A',
                                    kick_off_time_utc: ev?.startTimestamp ? new Date(ev.startTimestamp * 1000).toUTCString() : startTimeFull,
                                    venue: ev?.venue?.name || 'N/A',
                                    stadium_capacity: ev?.venue?.capacity || 'N/A',
                                    referee: ev?.referee?.name || 'N/A',
                                    home_team: ev?.homeTeam?.name || team1,
                                    away_team: ev?.awayTeam?.name || team2
                                },
                                h2h: h2hD?.teamDuel || h2hD || null,
                                lineups: {
                                    home_formation: lineD?.home?.formation || 'N/A',
                                    away_formation: lineD?.away?.formation || 'N/A',
                                    home_players: (lineD?.home?.players || []).map(p => p?.player?.name).filter(Boolean),
                                    away_players: (lineD?.away?.players || []).map(p => p?.player?.name).filter(Boolean),
                                    home_missing_players: (lineD?.home?.missingPlayers || []).map(p => p?.player?.name).filter(Boolean),
                                    away_missing_players: (lineD?.away?.missingPlayers || []).map(p => p?.player?.name).filter(Boolean)
                                },
                                pregame_form: preD || null
                            };
                        } catch (e) {
                            return null;
                        }
                    };

                    const fd = await getFootballData();
                    const evInfo = fd?.event || {};
                    const duel = fd?.h2h || {};
                    const lu = fd?.lineups || {};
                    const pre = fd?.pregame_form || {};
                    const homeForm = (pre?.homeTeam?.form || []).join(' ') || 'N/A';
                    const awayForm = (pre?.awayTeam?.form || []).join(' ') || 'N/A';
                    const totalH2H = (duel.homeWins || 0) + (duel.draws || 0) + (duel.awayWins || 0);

                    const formatForm = (arr) => (arr || []).map(r => `<span class="form-chip form-${r}">${r}</span>`).join(' ');

                    const awayMiss = (lu.away_missing_players || []);
                    const detailsHTML = `
          <div class="neo-wrap">

              <span class="pill">Draws: ${duel.draws ?? 'N/A'}</span>
              <span class="pill">${team2} Wins: ${duel.awayWins ?? 'N/A'}</span>
              <span class="pill">Total Meetings: ${totalH2H}</span>
            </div>
          </div>
          <div class="neo-wrap">
            <div class="neo-title">Lineups & Formations</div>
            <div class="kv-grid">
              <div class="team-col">
                <h5>${team1} (${lu.home_formation || 'N/A'})</h5>
                <ul class="mini-list">${homePlayers.length ? homePlayers.map(p => `<li>• ${p}</li>`).join('') : '<li>• No lineup data</li>'}</ul>
                <p class="mt-2 text-xs text-red-600"><b>Missing:</b> ${homeMiss.length ? homeMiss.join(', ') : 'None reported'}</p>
              </div>
              <div class="team-col">
                <h5>${team2} (${lu.away_formation || 'N/A'})</h5>
                <ul class="mini-list">${awayPlayers.length ? awayPlayers.map(p => `<li>• ${p}</li>`).join('') : '<li>• No lineup data</li>'}</ul>
                <p class="mt-2 text-xs text-red-600"><b>Missing:</b> ${awayMiss.length ? awayMiss.join(', ') : 'None reported'}</p>
              </div>
            </div>
          </div>
          <div class="neo-wrap">
            <div class="neo-title">Pregame Form</div>
            <div class="kv-grid">
              <div class="kv">
                <b>${team1}</b>
                <span>Rating ${pre?.homeTeam?.avgRating || 'N/A'} | Pos #${pre?.homeTeam?.position || 'N/A'} | ${pre?.label || 'Pts'} ${pre?.homeTeam?.value || 'N/A'}</span>
                <div class="pill-row">${formatForm(pre?.homeTeam?.form)}</div>
              </div>
              <div class="kv">
                <b>${team2}</b>
                <span>Rating ${pre?.awayTeam?.avgRating || 'N/A'} | Pos #${pre?.awayTeam?.position || 'N/A'} | ${pre?.label || 'Pts'} ${pre?.awayTeam?.value || 'N/A'}</span>
                <div class="pill-row">${formatForm(pre?.awayTeam?.form)}</div>
              </div>
            </div>
          </div>
        `;

                    const faqHTML = `
          <div class="space-y-4 text-left overflow-visible break-words">
            <h3 class="text-xl sm:text-2xl md:text-3xl font-bold text-gray-900">${matchName} - Match Details</h3>
            ${detailsHTML}
            <h3 class="text-xl font-bold text-gray-900">Match Live Links</h3>
            <div class="mobile-switch">
              <button class="switch-btn active" data-target="lineupPanel">Lineups</button>
              <button class="switch-btn" data-target="pregamePanel">Pregame Form</button>
            </div>
            <div id="lineupPanel" class="switch-panel">${`
              <div class="neo-wrap">
                <div class="neo-title">Lineups & Formations</div>
                <div class="kv-grid">
                  <div class="team-col">
                    <h5>${team1} (${lu.home_formation || 'N/A'})</h5>
                    <ul class="mini-list">${homePlayers.length ? homePlayers.map(p => `<li>• ${p}</li>`).join('') : '<li>• No lineup data</li>'}</ul>
                    <p class="mt-2 text-xs text-red-600"><b>Missing:</b> ${homeMiss.length ? homeMiss.join(', ') : 'None reported'}</p>
                  </div>
                  <div class="team-col">
                    <h5>${team2} (${lu.away_formation || 'N/A'})</h5>
                    <ul class="mini-list">${awayPlayers.length ? awayPlayers.map(p => `<li>• ${p}</li>`).join('') : '<li>• No lineup data</li>'}</ul>
                    <p class="mt-2 text-xs text-red-600"><b>Missing:</b> ${awayMiss.length ? awayMiss.join(', ') : 'None reported'}</p>
                  </div>
                </div>
              </div>
            `}</div>
            <div id="pregamePanel" class="switch-panel hidden">${`
              <div class="neo-wrap">
                <div class="neo-title">Pregame Form</div>
                <div class="kv-grid">
                  <div class="kv">
                    <b>${team1}</b>
                    <span>Rating ${pre?.homeTeam?.avgRating || 'N/A'} | Pos #${pre?.homeTeam?.position || 'N/A'} | ${pre?.label || 'Pts'} ${pre?.homeTeam?.value || 'N/A'}</span>
                    <div class="pill-row">${formatForm(pre?.homeTeam?.form)}</div>
                  </div>
                  <div class="kv">
                    <b>${team2}</b>
                    <span>Rating ${pre?.awayTeam?.avgRating || 'N/A'} | Pos #${pre?.awayTeam?.position || 'N/A'} | ${pre?.label || 'Pts'} ${pre?.awayTeam?.value || 'N/A'}</span>
                    <div class="pill-row">${formatForm(pre?.awayTeam?.form)}</div>
                  </div>
                </div>
              </div>
            `}</div>
            <h3 class="text-2xl font-bold border-b-2 border-gray-200 pb-2 text-gray-900">Frequently Asked Questions</h3>
            <div class="space-y-3">
              <div class="faq-card">
                <h4 class="text-lg font-semibold text-gray-900 break-words">1. Which teams are playing this match?</h4>
                <p class="text-gray-600 break-words">${team1.trim()} will face off against ${team2.trim()} in this exciting match.</p>
              </div>
              <div class="faq-card">
                <h4 class="text-lg font-semibold text-gray-900 break-words">2. When does the match start?</h4>
                <p class="text-gray-600 break-words">Kick-off is ${evInfo.kick_off_time_utc || startTimeFull}.</p>
              </div>
              <div class="faq-card">
                <h4 class="text-lg font-semibold text-gray-900 break-words">3. How long will the match run?</h4>
                <p class="text-gray-600 break-words">The match is expected to last about ${duration} hours, including stoppage time.</p>
              </div>
              <div class="faq-card">
                <h4 class="text-lg font-semibold text-gray-900 break-words">4. Where can I watch this match live?</h4>
                <p class="text-gray-600 break-words">Stream the live match of ${matchName} via <a href="https://www.yosin-tv.net/" target="_blank" class="text-blue-600 hover:underline">YoSinTV Free Live Stream</a>.</p>
              </div>
              <div class="faq-card"><h4 class="text-lg font-semibold text-gray-900 break-words">5. What league is this fixture in?</h4><p class="text-gray-600 break-words">${evInfo.league || league || 'N/A'}.</p></div>
              <div class="faq-card"><h4 class="text-lg font-semibold text-gray-900 break-words">6. Which round is this match?</h4><p class="text-gray-600 break-words">Round ${evInfo.round || 'N/A'}.</p></div>
              <div class="faq-card"><h4 class="text-lg font-semibold text-gray-900 break-words">7. Where is this match being played?</h4><p class="text-gray-600 break-words">${evInfo.venue || 'Venue not announced yet'}.</p></div>
              <div class="faq-card"><h4 class="text-lg font-semibold text-gray-900 break-words">8. Who is the referee?</h4><p class="text-gray-600 break-words">${evInfo.referee || 'Referee details not available yet'}.</p></div>
              <div class="faq-card"><h4 class="text-lg font-semibold text-gray-900 break-words">9. What is the head-to-head record?</h4><p class="text-gray-600 break-words">${team1} wins: ${duel.homeWins ?? 'N/A'}, draws: ${duel.draws ?? 'N/A'}, ${team2} wins: ${duel.awayWins ?? 'N/A'}.</p></div>
              <div class="faq-card"><h4 class="text-lg font-semibold text-gray-900 break-words">10. What are the expected formations?</h4><p class="text-gray-600 break-words">${team1}: ${lu.home_formation || 'N/A'} | ${team2}: ${lu.away_formation || 'N/A'}.</p></div>
              <div class="faq-card"><h4 class="text-lg font-semibold text-gray-900 break-words">11. What are the latest pregame form trends?</h4><p class="text-gray-600 break-words">${team1}: ${homeForm} | ${team2}: ${awayForm}.</p></div>
              <div class="faq-card"><h4 class="text-lg font-semibold text-gray-900 break-words">12. Are lineups confirmed?</h4><p class="text-gray-600 break-words">Predicted lineups are available early, and confirmed lineups usually appear closer to kick-off.</p></div>
            </div>
          </div>
        `;
                    document.getElementById('match-info').innerHTML = faqHTML;
                    document.querySelectorAll('.switch-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            document.querySelectorAll('.switch-panel').forEach(p => p.classList.add('hidden'));
                            const t = document.getElementById(btn.dataset.target);
                            if (t) t.classList.remove('hidden');
                        });
                    });

                    // Optional "More Matches" support (if section exists in this template)
                    const more = document.getElementById('more-matches');
                    if (more) {
                        more.innerHTML = '';
                        for (const api of mainApis) {
                            try {
                                const r = await fetch(api);
                                if (!r.ok) continue;
                                const j = await r.json();
                                (j.matches || []).slice(0, 5).forEach(m => {
                                    if (normalize(m.team1) === normalize(team1)) return;
                                    const card = document.createElement('a');
                                    card.href = m.details_url || `?yosintv=${normalize(m.team1 + m.team2)}`;
                                    card.className = 'bg-gray-50 p-4 rounded-lg flex justify-between items-center hover:bg-gray-100 block';
                                    card.innerHTML = `<span>${m.team1} vs ${m.team2}</span><span class="text-sm text-gray-500">${new Date(m.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`;
                                    more.appendChild(card);
                                });
                            } catch (e) {}
                        }
                    }
                });
            }, 0);
        });
    </script>
</body>

</html>
