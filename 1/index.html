<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta id="meta-title" name="title" content="YoSinTV - Cricket | Football | Playing XI | Sports News"/>
  <meta id="meta-description" name="description" content="YoSinTV is sports website that covers all the Cricket Matches, World Cup, International/Domestic Matches, Football Matches, etc."/>
  <meta id="meta-keywords" name="keywords" content="live cricket, live football, match schedule, playing XI, match preview, T20 World Cup 2026"/>
  <meta name="author" content="YoSinTV"/>
  <meta name="robots" content="index, follow"/>
  <meta id="meta-theme-color" name="theme-color" content="#0b1226"/>

  <link rel="icon" href="https://web.cricfoot.net/favico.png" type="image/png"/>
  <link rel="apple-touch-icon" href="https://web.cricfoot.net/favico.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg: #eff4ff;
      --bg-2: #e7eefc;
      --surface: #ffffff;
      --surface-soft: #f8fbff;
      --ink: #101935;
      --muted: #526080;
      --line: #d6e1f5;
      --brand: #165dff;
      --brand-2: #0a3fc7;
      --accent: #00b894;
      --warn: #ff6b35;
      --rad: 18px;
      --rad-sm: 12px;
      --shadow-sm: 0 8px 24px rgba(11, 29, 84, 0.08);
      --shadow-lg: 0 18px 40px rgba(9, 25, 66, 0.16);
      --fh: 'Barlow Condensed', sans-serif;
      --fb: 'Manrope', sans-serif;
    }

    body.dk {
      --bg: #0b1226;
      --bg-2: #111b34;
      --surface: #14203f;
      --surface-soft: #192749;
      --ink: #eaf0ff;
      --muted: #9fb0d3;
      --line: #27375f;
      --brand: #4f86ff;
      --brand-2: #80a7ff;
      --accent: #2bd6b3;
      --warn: #ff8d5f;
      --shadow-sm: 0 10px 24px rgba(2, 8, 25, 0.45);
      --shadow-lg: 0 20px 48px rgba(1, 6, 20, 0.6);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--fb);
      color: var(--ink);
      background:
        radial-gradient(1100px 480px at 80% -20%, rgba(22, 93, 255, 0.22), transparent 70%),
        radial-gradient(900px 400px at -10% 10%, rgba(0, 184, 148, 0.14), transparent 62%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 35%, var(--bg) 100%);
      line-height: 1.55;
      padding-top: 76px;
    }
    img { max-width: 100%; height: auto; }

    #yst-hdr {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    }
    .hdr-in {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1rem;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }
    .logo img { height: 62px; display: block; }
    .hdr-r { display: flex; align-items: center; gap: 0.7rem; }
    .si {
      border: 1px solid var(--line);
      background: var(--surface-soft);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      width: 176px;
      outline: none;
      transition: width .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .si:focus {
      width: 230px;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 22%, transparent);
    }
    .tgl { position: relative; display: inline-block; width: 52px; height: 28px; cursor: pointer; }
    .tgl input { display: none; }
    .sldr {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: color-mix(in srgb, var(--muted) 32%, #fff);
      transition: .3s;
    }
    .sldr::before {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      bottom: 3px;
      border-radius: 50%;
      background: #fff;
      transition: .3s;
      box-shadow: 0 3px 8px rgba(0,0,0,.22);
    }
    .tgl input:checked + .sldr {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
    }
    .tgl input:checked + .sldr::before { transform: translateX(24px); }

    .yst-nav {
      position: sticky;
      top: 76px;
      z-index: 999;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(8px);
    }
    .nav-in {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      gap: 0.2rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-in::-webkit-scrollbar { display: none; }
    .nl {
      text-decoration: none;
      color: var(--muted);
      font-family: var(--fh);
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-size: .82rem;
      padding: 12px 12px;
      border-bottom: 2px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }
    .nl:hover, .nl.active {
      color: var(--ink);
      border-bottom-color: var(--brand);
    }

    .hero {
      max-width: 1140px;
      margin: 16px auto 14px;
      padding: 0 1rem;
    }
    .hero-box {
      position: relative;
      overflow: hidden;
      border-radius: calc(var(--rad) + 2px);
      background: linear-gradient(125deg, #0f3cb9 0%, #165dff 45%, #0f8f83 100%);
      color: #fff;
      padding: 20px 18px;
      box-shadow: var(--shadow-lg);
      isolation: isolate;
    }

    @media (max-width: 760px) {
      body { padding-top: 72px; }
      .hdr-in { height: 72px; }
      .logo img { height: 56px; }
      .yst-nav { top: 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>

  <script src="config-loader.js"></script>
</head>
<body>
<header id="yst-hdr">
  <div class="hdr-in">
    <a class="logo" href="/"><img alt="YoSinTV" id="logo-img" src="https://web.cricfoot.net/logo.png"></a>
    <div class="hdr-r">
      <input class="si" id="yst-s" placeholder="Quick search" type="text"/>
      <label class="tgl" title="Dark Mode"><input id="yst-dm" type="checkbox"/><span class="sldr"></span></label>
    </div>
  </div>
</header>

<nav class="yst-nav">
  <div class="nav-in">
    <a class="nl active" href="#" data-filter="all">Home</a>
    <a class="nl" href="#" data-filter="Cricket">Cricket</a>
    <a class="nl" href="#" data-filter="Football">Football</a>
    <a class="nl" href="#" data-filter="Playing XI">Playing XI</a>
  </div>
</nav>

<div class="hero" style="text-align: center;">
  <div class="hero-box">
    <h1>Live Sports Updates</h1>
    <p>Cricket & Football Matches, Schedules & Playing XI</p>
  </div>
</div>

<div style="text-align: center; margin: 20px 0;">
  <ins class="adsbygoogle" style="display:block" data-ad-format="auto" data-full-width-responsive="true"></ins>
</div>

<footer style="text-align: center; padding: 40px 20px; color: #666; margin-top: 40px;">
  <p>&copy; <span id="yr">2025</span> YoSinTV. All rights reserved.</p>
</footer>

<button id="btt" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top">▲</button>

<!-- ENCRYPTED SCRIPTS -->
<script src="app-ads.js"></script>
<script src="app-theme.js"></script>
<script src="app-main.js"></script>
<script src="app-popups.js"></script>

</body>
</html>
